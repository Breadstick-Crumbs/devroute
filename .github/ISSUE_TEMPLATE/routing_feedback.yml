name: Routing feedback
description: Susanoo chose the wrong workflow, or scored complexity or risk badly for a task.
labels: [routing, heuristics]
body:
  - type: textarea
    id: task
    attributes:
      label: Task description
      description: The exact text you gave Susanoo (redact anything confidential).
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Susanoo output
      description: Paste `susanoo assess --json "<task>"` or the relevant part of the brief.
      render: json
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: Profile you expected
      options: [FAST, STANDARD, DEEP]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Which risk or complexity factor was missed or over-weighted? Proposed suite case welcome.
