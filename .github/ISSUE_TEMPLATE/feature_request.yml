name: Feature request
description: Suggest an improvement to DevRoute.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Tasks, records, or measurements that show the need.
