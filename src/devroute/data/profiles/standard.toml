name = "standard"
title = "STANDARD"
summary = "Typical feature or moderate modification. Investigate, plan, build incrementally, test, review, integrate."
intended_for = "New features, multi-file changes, moderate-risk changes, and bugs whose cause needs investigation."
planning = "short written plan shared before editing"
delegation = "optional: an independent reviewer subagent for the review phase"
review = "code review of the full diff; use the devroute-reviewer subagent when risk is moderate or higher"
isolation = "feature branch recommended"
verification_depth = "standard: unit tests, linting, and integration checks for touched boundaries"
report = "completion report with verification evidence"

approval_checkpoints = ["Approve the implementation plan before files are changed."]

[[phases]]
id = "investigate"
title = "Investigate"
action = "Read the relevant code, tests, and conventions. Identify every component the change touches."

[[phases]]
id = "clarify"
title = "Clarify"
action = "If requirements are ambiguous, ask focused questions. Skip when the task is already precise."

[[phases]]
id = "plan"
title = "Plan"
action = "Write a short plan: files to change, approach, tests to add, and risks."
approval = true

[[phases]]
id = "implement"
title = "Implement incrementally"
action = "Build in small steps, running relevant tests after each meaningful step."

[[phases]]
id = "test"
title = "Test"
action = "Add or update automated tests for new behavior and run the required verification."

[[phases]]
id = "review"
title = "Review"
action = "Review the complete diff for correctness, edge cases, and convention fit; delegate to devroute-reviewer when risk is moderate or higher."

[[phases]]
id = "integrate"
title = "Integration validation"
action = "Confirm the change works with the rest of the system: run integration checks and the broader test suite."

[[phases]]
id = "report"
title = "Report"
action = "Report what changed, the verification that actually ran (with results), and remaining limitations."

[[capabilities]]
id = "version_control"
level = "required"
reason = "incremental commits and diff review"

[[capabilities]]
id = "code_review"
level = "recommended"
reason = "STANDARD workflow review phase"

[[capabilities]]
id = "code_navigation"
level = "recommended"
reason = "investigate affected code before changing it"
