hooks:
  PreToolUse:
    - matcher: "Edit|Write|MultiEdit|NotebookEdit|Bash|PowerShell"
      hooks:
        - type: command
          command: "devroute hook pre-tool-use"
          timeout: 30
  Stop:
    - hooks:
        - type: command
          command: "devroute hook stop"
          timeout: 30
  SessionStart:
    - matcher: "compact"
      hooks:
        - type: command
          command: "devroute hook session-start"
          timeout: 30
  PostCompact:
    - hooks:
        - type: command
          command: "devroute hook post-compact"
          timeout: 30
