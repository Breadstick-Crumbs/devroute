# Environment managers that keep the project's Python virtualenv outside the repository by
# default (Poetry: {cache-dir}/virtualenvs; Pipenv: a central virtualenvs folder). When one is
# detected and the project has no in-project environment (.venv, venv, env), Python tools run
# through `run_prefix`; if the manager is not on PATH those checks become manual, so a result
# from the wrong interpreter is never recorded as executed evidence. First match wins.
#   markers          project files or globs whose presence indicates the manager
#   pyproject_tools  [tool.<name>] sections in pyproject.toml that indicate it
#   unless_markers   files that mean another manager owns the environment (uv keeps its
#                    environment in .venv; a leftover poetry.lock must not override that)
# Only the packaged catalog is read; .susanoo/tools.toml cannot add environments.

[[environments]]
id = "poetry"
name = "Poetry"
binary = "poetry"
run_prefix = ["poetry", "run"]
markers = ["poetry.lock"]
pyproject_tools = ["poetry"]
unless_markers = ["uv.lock"]

[[environments]]
id = "pipenv"
name = "Pipenv"
binary = "pipenv"
run_prefix = ["pipenv", "run"]
markers = ["Pipfile", "Pipfile.lock"]
unless_markers = ["uv.lock"]

# JavaScript package managers. The project's manager comes from package.json "packageManager",
# else the first entry whose lockfile exists; without either, `[selection]
# default_package_manager` applies. Only the packaged catalog defines these.
#   markers  lockfiles that identify the manager
#   add_dev  replaces {js_add_dev} in install hints
#   create   replaces {js_create} in install hints (project initializers)
#   run      replaces {js_run} in run commands (`bun test` is Bun's own test runner, so package
#            scripts always go through `run`)

[[package_managers]]
id = "pnpm"
markers = ["pnpm-lock.yaml"]
add_dev = "pnpm add -D"
create = "pnpm create"
run = ["pnpm", "run"]

[[package_managers]]
id = "bun"
markers = ["bun.lock", "bun.lockb"]
add_dev = "bun add -d"
create = "bun create"
run = ["bun", "run"]

[[package_managers]]
id = "yarn"
markers = ["yarn.lock"]
add_dev = "yarn add -D"
create = "yarn create"
run = ["yarn", "run"]

[[package_managers]]
id = "npm"
markers = ["package-lock.json", "npm-shrinkwrap.json"]
add_dev = "npm install --save-dev"
create = "npm init"
run = ["npm", "run"]
