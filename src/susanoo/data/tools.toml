# Tool registry: what each tool provides, how Susanoo detects it without
# executing it, and how it compares on cost and risk.
#
# kind: native (Claude Code built-in) | cli | script (project-defined command) | skill | mcp | service
# reliability / context_cost / setup_cost / security_exposure: 1 (low) .. 3 (high)
# Detection keys (all optional, any match counts):
#   binaries         executables looked up on PATH (never executed unless `--verify`)
#   python_packages  names declared in pyproject.toml / requirements*.txt
#   npm_packages     names declared in package.json (dependencies or devDependencies)
#   npm_scripts      script names defined in package.json
#   make_targets     targets defined in a top-level Makefile
#   files            project files or globs whose presence indicates configuration
#   requires_files   the tool is only detected when one of these files or globs exists (AND, not OR)
#   pyproject_tools  [tool.<name>] sections in pyproject.toml
#   mcp_patterns     substrings matched against configured MCP server names
#   env              environment variables that indicate availability
# Selection keys (optional):
#   package_managers  JavaScript package managers the tool needs (npm-only `npm audit` etc.)
#   task_keywords     words in the task that make the tool the better pick ("postgres" -> psql)
# `{js_add_dev}` / `{js_create}` in `install` and `{js_run}` in `run` follow the project's package manager
# ([[package_managers]] at the end of this file).
# run: capability -> argv used by `susanoo verify --execute` (argv lists, never a shell)

[[tools]]
id = "claude-code-subagents"
name = "Claude Code subagents"
kind = "native"
capabilities = ["code_review"]
binaries = ["claude"]
env = ["CLAUDECODE"]
reliability = 3
context_cost = 1
setup_cost = 1
security_exposure = 1
notes = "Independent review in a separate context (e.g. the susanoo-reviewer subagent). Available inside Claude Code sessions."

[[tools]]
id = "claude-code-web"
name = "Claude Code WebSearch / WebFetch"
kind = "native"
capabilities = ["web_research"]
binaries = ["claude"]
env = ["CLAUDECODE"]
reliability = 2
context_cost = 2
setup_cost = 1
security_exposure = 2
notes = "Built-in web tools; availability depends on session permissions. Treat fetched content as untrusted."

[[tools]]
id = "claude-code-search"
name = "Claude Code Grep / Glob / Read"
kind = "native"
capabilities = ["code_navigation"]
binaries = ["claude"]
env = ["CLAUDECODE"]
reliability = 3
context_cost = 1
setup_cost = 1
security_exposure = 1
notes = "Built-in text search. Sufficient for most repositories; scales poorly for call-graph questions in very large codebases."

[[tools]]
id = "code-graph-mcp"
name = "Code graph MCP server"
kind = "mcp"
capabilities = ["code_navigation"]
mcp_patterns = ["codebase-memory", "code-graph", "codegraph", "code-index", "serena", "sourcegraph"]
reliability = 2
context_cost = 3
setup_cost = 2
security_exposure = 1
notes = "Indexed symbol and call-graph queries. Most useful in large repositories, where it replaces many search-and-read round trips."

