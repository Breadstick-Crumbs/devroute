# Susanoo default heuristics.
#
# Everything in this file can be overridden per project in `.susanoo/config.toml`.
# Tables are deep-merged; arrays of tables with an `id` (signals, controls,
# verification) are merged by id, so a project can adjust one signal without
# copying the whole catalog.
#
# These values are hand-tuned starting points, not validated measurements.
# Use `susanoo eval` to see how changes affect routing on the reference suite.

schema_version = 1

[assessment]
# Tasks shorter than this (in words) are flagged as low-confidence even if signals match.
min_words = 3
# When two or more distinct signals raise the same dimension to at least this level,
# the dimension is raised one more step (capped at 3).
stacking_level = 2
# Baseline scores applied before any signal matches.
baseline = { implementation_complexity = 1 }

[assessment.negation]
# An instruction to leave a part of the code base alone ("without touching the payments
# module", "don't change the database schema") is ignored when signals are matched, and listed
# in the assessment. Ignoring text can only lower risk, so this is deliberately narrow:
# - only instructions, not descriptions ("the job is not changing the hash" still counts);
# - the excluded part must end in a code-location noun, and the ignored span ends there, so
#   anything after it ("— drop the users table") still counts;
# - preservation requirements without a location ("without breaking payments", "must not
#   change existing invoices", "without altering password hashing") still count;
# - spans that contain a `keep_signals` match are never ignored.
# In `patterns`, {target} stands for an optional determiner, up to `filler` plain words, and
# one of `locations`; {location} is a location alone.
patterns = [
    'without (?:touching|changing|modifying|altering|editing) {target}',
    '(?:do|must|should|will)(?: not|n.t) (?:touch|change|modify|alter|edit) {target}',
    'never (?:touch|change|modify|alter|edit) {target}',
    '(?:leave|keep) {target} (?:alone|untouched|unchanged|as is)',
    'no {location} (?:changes?|modifications?|edits?)',
]
locations = [
    'modules?', 'files?', 'code', 'codebase', 'components?', 'pages?', 'screens?', 'views?',
    'folders?', 'director(?:y|ies)', 'packages?', 'layer', 'ui', 'frontend', 'front-end',
    'backend', 'back-end', 'css', 'styles?', 'stylesheets?', 'templates?', 'schemas?',
    'database', 'db', 'tables?', 'tests?', 'docs', 'documentation', 'config', 'configuration',
]
filler = 3
keep_signals = ["destructive-data", "production"]
# Negation is discarded entirely unless a `requires_signals` keyword (a clearly trivial edit)
# still matches outside the ignored text, no `blocking_signals` (new functionality) match, and
# the rest of the task, without the ignored text and its connecting "and"/"but"/comma, is a
# single clause: no `clause` match and no second sentence. These are keyword checks; they do
# not prove the rest of the task is harmless, which is why they are this strict.
requires_signals = ["trivial-edit"]
blocking_signals = ["feature"]
clause = '[,;:]|(?<![\w-])(?:and|then|plus|also|but|or|while)(?![\w-])'

[complexity]
weights = { implementation_complexity = 0.35, architectural_complexity = 0.25, affected_components = 0.25, testing_difficulty = 0.15 }
thresholds = { moderate = 0.30, high = 0.62 }

[risk]
dimensions = ["security_privacy", "data_integrity", "irreversibility", "external_dependencies"]
# Risk is dominated by its most severe dimension so one severe concern cannot be
# averaged away by unrelated low scores.
max_weight = 0.75
thresholds = { moderate = 0.30, high = 0.60, critical = 0.90 }
# Number of risk dimensions at level 3 that makes risk critical regardless of score.
critical_severe_dimensions = 2

[uncertainty]
thresholds = { moderate = 0.50, high = 0.80 }
# Added to the uncertainty score when the assessment itself has low confidence.
low_confidence_penalty = 0.50

[routing]
# Overrides below this profile are raised to it when risk is critical.
critical_risk_floor = "standard"

[records]
# Records are written to .susanoo/records/ only after `susanoo init`.
store_task_text = true

[context]
# Repository context adjustments (explained in every assessment that uses them).
# Also the size at which indexed code navigation (code graphs) is preferred over text search.
large_repo_files = 2000

[selection]
# Score shift applied to code-navigation candidates by repository size: indexed tools gain it
# in large repositories and lose it in small ones; built-in text search loses it in large ones.
code_navigation_size_adjustment = 5.0

[auto]
# Automatic routing (`susanoo init --global`, or `--auto` with the settings scope): every prompt
# is classified, and only clear coding tasks are routed. Questions and ambiguous prompts get a
# short note instead, and Claude routes them itself if they need code changes (never lower than
# the keyword result for the prompt).
# A prompt starting with this prefix is never routed.
skip_prefix = "?"
# Leading phrases removed before classifying ("please", "can you", "ok now", ...).
polite = [
    "please", "pls", "can you", "could you", "would you", "will you", "let'?s", "i want you to",
    "i need you to", "i.?d like you to", "(?:i|we) (?:want|need) to", "go ahead and", "ok(?:ay)?", "now",
    "also", "and", "then", "so",
]
# A prompt (after polite phrases) starting with one of these is a coding task.
task_verbs = [
    "add", "implement", "create", "build", "make", "fix", "refactor", "update", "change", "modify",
    "remove", "delete", "drop", "rename", "move", "migrate", "upgrade", "bump", "write", "rewrite",
    "set ?up", "integrate", "optimi[sz]e", "speed up", "enable", "disable", "replace",
    "convert", "deploy", "ship", "clean ?up", "extract", "wire up", "hook up", "configure",
    "introduce", "handle", "improve", "resolve", "generate", "scaffold", "document",
    "redesign", "restyle", "polish", "tweak", "adjust", "allow", "prevent", "make sure", "ensure",
    "validate", "translate", "localize", "bootstrap", "rotate", "revert",
]
# A task verb followed by one of these is not a coding task ("write me a haiku", "make sense of
# this", "drop it", "move on", "make sure you understand").
not_after_verb = ["me", "us", "you", "sense", "it", "on", "a list", "an? (?:overview|summary)"]
# A prompt starting with one of these is a question, even if it mentions code.
question_starts = [
    "what", "what'?s", "why", "how", "where", "when", "who", "which", "explain", "describe", "tell me",
    "show me", "summari[sz]e", "is", "are", "does", "do", "did", "should", "would", "can i", "could i",
    "is there", "are there", "compare", "review", "look at", "check", "investigate", "find", "list",
    "read", "walk me through", "help me understand",
]
# A task routed with one of these phrases runs hands-off, like an autonomous permission mode.
autonomy = [
    "autonomous(?:ly)?", "do(?: not|n.?t) ask me(?: anything)?", "without asking me", "no questions",
    "just do it", "on your own", "do(?: not|n.?t) (?:check in|wait for me)(?: until (?:it.?s )?done)?",
    "no need to (?:ask|check with|confirm with) me",
]
# Tasks shorter than this many words are treated as ambiguous ("fix it").
min_words = 3
# While a task is open, a new task prompt continues it when it starts with one of these, or
# arrives within `follow_up_minutes` of the routing; otherwise it replaces the open task.
continuation = ["also", "and", "then", "now", "ok(?:ay)?", "next", "plus", "instead", "actually", "but", "same"]
follow_up_minutes = 20
# Route before the first edit: when a prompt got the note and Claude edits a project file with no
# route open, that first edit is denied once and Claude is told to run `susanoo route` first; a
# retry goes through. It never asks the user, so it applies in every permission mode. Edits made
# through shell commands are not covered.
route_before_edit = true

[enforcement]
# Used only when the /susanoo skill was installed with `susanoo init --enforce`.
# Profiles whose file edits wait for the user to approve the plan.
approval_profiles = ["standard", "deep"]
# Claude Code permission modes in which the user chose to let Claude work hands-off. In these
# modes (or when a task asks for autonomy) Susanoo adds no approval and no questions; Claude
# Code's own permission settings decide. The evidence gate still applies.
autonomous_modes = ["acceptEdits", "auto", "dontAsk", "bypassPermissions"]
# Profiles whose turn cannot end while required verification lacks evidence.
evidence_profiles = ["fast", "standard", "deep"]
# Consecutive blocks (with nothing changing) before the evidence gate lets the turn end.
max_stop_blocks = 3
edit_tools = ["Edit", "Write", "MultiEdit", "NotebookEdit"]
# Shell commands that may modify files or the environment. Before plan approval they
# require confirmation (asked, not denied). Case-insensitive regular expressions.
shell_write_patterns = [
    '(?<![<>&-])[0-9]?>{1,2}\s*(?!/dev/null|&|nul\b)[^\s|&]',
    '\bsed\b[^|;&]*?\s(?:-[a-z]*i[a-z]*|--in-place)\b',
    '\b(?:perl|ruby)\s+-[a-z]*i',
    '\btee\b',
    '\b(?:rm|mv|cp|mkdir|touch|chmod|truncate|dd|ln)\s',
    '\bgit\s+(?:commit|apply|am|restore|reset|merge|rebase|cherry-pick|checkout\s+--|stash\s+pop)\b',
    '\b(?:npm|pnpm|yarn|bun)\s+(?:install|add|remove|uninstall|i)\b',
    '\bpip3?\s+(?:install|uninstall)\b',
    '\b(?:Set-Content|Add-Content|Out-File|New-Item|Remove-Item|Move-Item|Copy-Item)\b',
]
# Commands that need confirmation while the irreversible-action-gate control is active.
irreversible_commands = [
    '\bgit\s+push\b',
    '\bgit\s+(?:reset\s+--hard|clean\s+-[a-z]*f|branch\s+-D|filter-branch|filter-repo)\b',
    '\brm\s+-[a-z]*(?:rf|fr)',
    '\b(?:kubectl)\s+(?:apply|delete|replace|patch|scale|rollout)\b',
    '\b(?:terraform|tofu)\s+(?:apply|destroy|import)\b',
    '\bhelm\s+(?:install|upgrade|uninstall|rollback)\b',
    '\bvercel\b.*--prod',
    '\b(?:fly|flyctl)\s+deploy\b',
    '\bnetlify\s+deploy\b.*--prod',
    '\b(?:npm|pnpm|yarn)\s+publish\b',
    '\b(?:twine\s+upload|cargo\s+publish|docker\s+push|gh\s+release\s+create)\b',
    '\balembic\s+(?:upgrade|downgrade)\b',
    '\bprisma\s+(?:migrate\s+(?:deploy|reset)|db\s+push)\b',
    'manage\.py\s+(?:migrate|flush)\b',
    '\b(?:drop\s+(?:table|database|schema)|truncate\s+table|delete\s+from)\b',
]

# ---------------------------------------------------------------------------
# Signals: phrases in the task description that raise assessment dimensions.
# Patterns are case-insensitive regular expressions matched on word boundaries.
# `area` marks signals that represent a distinct feature area; the number of
# areas drives affected_components and parallelization.
# `kind = "scope"` signals disable `caps` from small-change signals.
# ---------------------------------------------------------------------------

[[signals]]
id = "large-scope"
label = "large-scope build"
kind = "scope"
patterns = [
    "(?:build|create|develop) (?:a|an|the|our|my)?\\s*(?:[\\w-]+\\s){0,4}(?:platform|application|app|system|service|saas|marketplace|product|portal|website)",
    "from scratch", "greenfield", "end[- ]to[- ]end", "full[- ]stack", "mvp", "saas",
]
effects = { implementation_complexity = 3, architectural_complexity = 3, technical_uncertainty = 2, testing_difficulty = 2 }
recommends = ["integration_testing", "code_review", "code_navigation"]

[[signals]]
id = "architecture-change"
label = "architectural change"
kind = "scope"
patterns = [
    "re-?architect\\w*", "architecture", "redesign", "rewrite", "refactor\\w*", "monolith",
    "micro-?services?", "modulari[sz]\\w*", 'migrat\w* (?:[\w-]+ ){0,3}(?:from|to)', "port (?:\\w+ )?to",
    "(?:major|framework|python|node|java|react) (?:version )?upgrade", "upgrade (?:to|from) \\w+",
]
effects = { implementation_complexity = 2, architectural_complexity = 3, affected_components = 2, technical_uncertainty = 1, testing_difficulty = 2 }
recommends = ["integration_testing", "code_review", "code_navigation"]

[[signals]]
id = "feature"
label = "new functionality"
patterns = ["add", "implement\\w*", "create", "introduce", "support (?:for )?", "new feature", "enable", "allow users? to"]
effects = { implementation_complexity = 2 }

[[signals]]
id = "bugfix"
label = "defect fix"
patterns = ["fix\\w*", "bugs?", "crash\\w*", "errors?", "exceptions?", "broken", "regressions?", "not working", "fails?", "failing"]
effects = { implementation_complexity = 1, technical_uncertainty = 1 }
requires = ["unit_testing"]

[[signals]]
id = "uncertain-cause"
label = "unknown or intermittent cause"
patterns = [
    "intermittent\\w*", "flaky", "sometimes", "randomly", "sporadic\\w*", "can'?t reproduce",
    "cannot reproduce", "unknown cause", "root cause", "investigate", "figure out", "not sure",
    "unclear", "why (?:does|is|do|are)", "mysterious",
]
effects = { technical_uncertainty = 3, testing_difficulty = 1 }

[[signals]]
id = "exploratory"
label = "exploratory or research work"
patterns = ["research", "evaluate", "explore", "prototype", "spike", "proof of concept", "poc", "experiment\\w*", "compare (?:options|approaches|libraries)", "new library", "unfamiliar"]
effects = { technical_uncertainty = 2 }
recommends = ["web_research"]

[[signals]]
id = "small-change"
label = "small, contained change"
patterns = [
    "typos?", "spelling", "rename (?:a |the )?(?:[\\w.]+ )?(?:variable|function|method|file|class|helper|constant)", "comments?",
    "docstrings?", "readme", "wording", "copy change", "change (?:the )?(?:color|colour|text|label|title|wording)",
    "bump (?:the )?version", "log message", "formatting", "whitespace", "lint warnings?", "one[- ]line",
]
caps = { implementation_complexity = 0, architectural_complexity = 0, affected_components = 1, testing_difficulty = 1 }

[[signals]]
id = "trivial-edit"
label = "clearly trivial edit"
# No effects. Negation ([assessment.negation] requires_signals) only applies when one of these
# still matches, because only then is the rest of the task known to be harmless. Broader
# small-change words ("comment", "one-line") are left out: "add a one-line fix to skip
# signature verification" is not trivial.
patterns = [
    "typos?", "spelling", "wording", "copy change", "change (?:the )?(?:color|colour|text|label|title|wording)",
    "rename (?:a |the )?(?:[\\w.]+ )?(?:variable|function|method|file|class|helper|constant)",
    "docstrings?", "readme", "formatting", "whitespace", "log message",
]

[[signals]]
id = "authentication"
label = "authentication / authorization"
area = "authentication"
patterns = [
    "auth", "authentication", "authori[sz]ation", "oauth\\w*", "sso", "jwt", "sessions?", "passwords?",
    "2fa", "mfa", "permissions?", "rbac", "role[- ]based", "access control", "login", "log in",
    "sign[- ]?in", "sign[- ]?up", "signup", "identity provider",
]
effects = { security_privacy = 3, affected_components = 1, testing_difficulty = 1 }
requires = ["security_analysis", "integration_testing"]

[[signals]]
id = "payments"
label = "payments / billing"
area = "payments"
patterns = ["payments?", "billing", "checkout", "subscriptions?", "stripe", "paypal", "invoic\\w*", "refunds?", "pricing plans?", "charge (?:the )?(?:card|customer)s?"]
effects = { security_privacy = 3, data_integrity = 3, external_dependencies = 3, testing_difficulty = 2 }
requires = ["payment_sandbox", "integration_testing", "security_analysis"]

[[signals]]
id = "sensitive-data"
label = "sensitive data / secrets"
area = "sensitive data handling"
patterns = [
    "pii", "personal data", "gdpr", "hipaa", "ccpa", "medical", "health records?", "ssns?", "credit cards?",
    "encrypt\\w*", "decrypt\\w*", "hash(?:ing)?", "crypto\\w*", "secrets?", "credentials?", "api keys?",
    "access tokens?", "private keys?", "certificates?",
]
effects = { security_privacy = 3, data_integrity = 1 }
requires = ["security_analysis", "secret_scanning"]

[[signals]]
id = "security-explicit"
label = "explicit security concern"
patterns = [
    "security", "vulnerab\\w*", "cve-?\\d*", "xss", "csrf", "ssrf", "sql injection", "injection",
    "saniti[sz]\\w*", "exploit\\w*", "cors", "rate limit\\w*", "audit log\\w*",
]
effects = { security_privacy = 3 }
requires = ["security_analysis", "code_review"]

[[signals]]
id = "database"
label = "database / schema"
area = "data layer"
patterns = ["database", "db", "schemas?", "migrations?", "sql", "postgres\\w*", "mysql", "sqlite", "mongo\\w*", "orm", "tables?", "columns?", "indexes", "redis"]
effects = { data_integrity = 2, architectural_complexity = 1, affected_components = 1, testing_difficulty = 1 }
requires = ["database_tooling"]
recommends = ["migration_checks"]

[[signals]]
id = "destructive-data"
label = "destructive or bulk data operation"
patterns = [
    'drop (?:the )?(?:[\w-]+ ){0,3}(?:tables?|columns?|database|collection|indexes)', "delete (?:all|user|customer|old)\\w* (?:data|records|rows|accounts)",
    "delet(?:e|es|ed|ing) (?:all |old |every |the )?(?:(?:user|customer|account|tenant)s? )?(?:data|records|rows|accounts)",
    "migrat(?:e|es|ed|ing) (?:the |all |existing )?(?:[\\w-]+ )?data",
    "purge", "truncate", "backfill", "data migration", "bulk (?:update|delete|import)", "wipe",
]
effects = { data_integrity = 3, irreversibility = 3 }
requires = ["migration_checks"]

[[signals]]
id = "production"
label = "production / deployment"
area = "deployment"
patterns = [
    "production", "prod", "deploy\\w*", "release", "rollout", "roll out", "infrastructure", "terraform",
    "kubernetes", "k8s", "dns", "ci/cd", "pipelines?", "hotfix", "live (?:site|system|users)",
]
effects = { irreversibility = 2, external_dependencies = 1 }
recommends = ["deployment"]

[[signals]]
id = "public-contract"
label = "public API / compatibility contract"
patterns = ["breaking change", "public api", "backwards?[- ]compatib\\w*", "deprecat\\w*", "api versioning", "sdk", "client library"]
effects = { irreversibility = 2, external_dependencies = 1, affected_components = 1 }
requires = ["integration_testing"]

[[signals]]
id = "ui"
label = "user interface"
area = "user interface"
patterns = [
    "dashboard", "admin (?:panel|ui|console|dashboard)?", "ui", "ux", "frontend", "front-end", "pages?", "screens?",
    "components?", "forms?", "css", "layout", "react", "vue", "svelte", "angular", "buttons?", "modal", "responsive",
]
effects = { affected_components = 1, testing_difficulty = 1 }
recommends = ["browser_testing"]

[[signals]]
id = "api"
label = "API / backend service"
area = "API / backend"
patterns = ["api", "endpoints?", "rest", "graphql", "grpc", "webhooks?", "backend", "back-end", "server", "routes?", "handlers?"]
effects = { affected_components = 1, external_dependencies = 1, testing_difficulty = 1 }
requires = ["integration_testing"]

[[signals]]
id = "third-party"
label = "third-party integration"
area = "third-party integration"
patterns = [
    "integrat\\w* with", "third[- ]party", "external (?:service|api|provider)", "sendgrid", "twilio", "mailgun",
    "s3", "aws", "gcp", "azure", "firebase", "supabase", "openai", "anthropic", "slack api", "github api",
]
effects = { external_dependencies = 2, technical_uncertainty = 1, testing_difficulty = 1 }
requires = ["integration_testing"]

[[signals]]
id = "concurrency"
label = "concurrency / distributed behavior"
area = "concurrency"
patterns = [
    "real[- ]?time", "websockets?", "concurren\\w*", "race conditions?", "deadlocks?", "async\\w*", "queues?",
    "workers?", "distributed", "locks?", "multi[- ]?thread\\w*", "event[- ]driven", "pub/?sub", "streaming",
]
effects = { architectural_complexity = 2, affected_components = 1, testing_difficulty = 3, technical_uncertainty = 1 }
requires = ["integration_testing"]

[[signals]]
id = "performance"
label = "performance"
area = "performance"
patterns = ["performance", "latency", "slow\\w*", "optimi[sz]\\w*", "caching", "cache", "scal(?:e|ing|ability)", "throughput", "memory leaks?", "n\\+1"]
effects = { testing_difficulty = 2, technical_uncertainty = 1 }
recommends = ["performance_testing"]

[[signals]]
id = "multi-tenant"
label = "multi-tenancy"
area = "multi-tenancy"
patterns = ["multi[- ]?tenan\\w*", "tenants?", "organi[sz]ations? and (?:teams|workspaces)", "workspaces?", "data isolation"]
# Tenant isolation touches every query and is a security boundary.
effects = { architectural_complexity = 3, affected_components = 2, security_privacy = 3, data_integrity = 2, testing_difficulty = 2 }
requires = ["security_analysis", "integration_testing"]

[[signals]]
id = "file-handling"
label = "file uploads / storage"
area = "file handling"
patterns = ["uploads?", "file storage", "attachments?", "images? processing", "downloads?"]
effects = { security_privacy = 2, affected_components = 1 }
requires = ["security_analysis"]

[[signals]]
id = "notifications"
label = "notifications / messaging"
area = "notifications"
patterns = ["notifications?", "emails?", "sms", "push messages?", "newsletters?"]
# Delivery normally goes through an external provider.
effects = { external_dependencies = 2, affected_components = 1 }

[[signals]]
id = "cross-cutting"
label = "cross-cutting or multi-part change"
patterns = [
    "frontend and backend", "front-end and back-end", "multiple (?:services|modules|packages|repos|components)",
    "across (?:all |the )?(?:services|modules|packages|repos|codebase)", "monorepo", "every (?:service|module|endpoint)",
]
effects = { affected_components = 2, parallelization = 2 }

[[signals]]
id = "tests-only"
label = "test-only change"
patterns = ["(?:add|write|improve) (?:unit |integration )?tests?", "test coverage", "increase coverage"]
requires = ["unit_testing"]
# Tests do not change runtime behavior, so security and data-integrity risk are capped, but only
# when the whole task is a test request: "write/add/improve tests for <subject>", where the
# subject has no second clause, no production or deployment words, and no "using/with/against"
# (live keys, real databases). Irreversibility and external dependencies are never capped, so
# production and sandbox controls stay. A scope signal also disables the caps.
caps = { security_privacy = 1, data_integrity = 1 }
caps_only_if = [
    '(?:please )?(?:write|add|improve|increase|expand|extend) (?:more )?(?:(?:unit|integration|end-to-end|e2e|regression|snapshot) )?(?:tests?|test coverage|coverage) (?:for|of|covering|around)(?: (?!(?:and|or|then|plus|also|while|but|after|before|so|which|that|by|in|on|at|from|into|to|for|of|via|through|over|under|using|with|against|all|every|real|live|shared|prod\w*|staging|deploy\w*|release\w*|ship\w*|publish\w*|migrat\w*|remov\w*|disabl\w*|enabl\w*|delet\w*|drop\w*|skip\w*|expos\w*|grant\w*|revok\w*|bypass\w*|allow\w*|chang\w*|fix\w*|updat\w*|set|sets|make|makes|let|lets|give\w*|show\w*|store\w*|send\w*|wipe\w*|purge\w*|truncat\w*|seed\w*|\w+ing)(?!\w))\w+(?:[./-]\w+)*){1,6}',
]
# Tests that touch a database or production are the main data-safety case: never capped.
caps_unless_signals = ["database", "destructive-data", "production"]

# ---------------------------------------------------------------------------
# Mandatory safety controls. They apply whenever their condition holds, and
# they cannot be removed by overriding the workflow profile.
# ---------------------------------------------------------------------------

[[controls]]
id = "security-review"
when = { dimension = "security_privacy", min = 2 }
description = "Independent security-focused review of the diff: authentication, authorization, input handling, secrets, and data exposure."
checkpoint = "Human approval before merging security-sensitive changes."
verification = ["security_scan", "independent_review"]

[[controls]]
id = "data-safety"
when = { dimension = "data_integrity", min = 2 }
description = "Verify schema and data changes against a non-production database, keep a rollback path, and avoid destructive operations on real data."
checkpoint = "Human approval before running migrations or data-modifying operations outside a disposable environment."
verification = ["migration_check", "integration_tests"]

[[controls]]
id = "irreversible-action-gate"
when = { dimension = "irreversibility", min = 2 }
description = "No deploys, releases, destructive commands, history rewrites, or force pushes without explicit approval."
checkpoint = "Human approval before any irreversible or outward-facing action."
verification = []

[[controls]]
id = "external-sandbox"
when = { dimension = "external_dependencies", min = 3 }
description = "Use sandbox or test-mode credentials for third-party services; never use live keys during development or testing."
checkpoint = "Human confirmation that only test-mode credentials are configured."
verification = ["integration_tests"]

# ---------------------------------------------------------------------------
# Verification rules. `levels` sets the baseline per profile; `escalate`
# raises the level when an assessment dimension reaches `min`; `signals`
# includes the step only when one of the listed signals matched.
# ---------------------------------------------------------------------------

[[verification]]
id = "unit_tests"
title = "Unit tests"
capability = "unit_testing"
levels = { fast = "required", standard = "required", deep = "required" }

[[verification]]
id = "static_analysis"
title = "Linting / static analysis"
capability = "static_analysis"
levels = { fast = "recommended", standard = "required", deep = "required" }

[[verification]]
id = "type_check"
title = "Type checking"
capability = "type_checking"
levels = { standard = "recommended", deep = "required" }

[[verification]]
id = "integration_tests"
title = "Integration tests"
capability = "integration_testing"
levels = { standard = "recommended", deep = "required" }
escalate = [
    { dimension = "affected_components", min = 2, level = "required" },
    { dimension = "external_dependencies", min = 2, level = "required" },
]

[[verification]]
id = "browser_tests"
title = "End-to-end / browser tests"
capability = "browser_testing"
signals = ["ui", "large-scope"]
levels = { standard = "recommended", deep = "recommended" }

[[verification]]
id = "security_scan"
title = "Security analysis"
capability = "security_analysis"
levels = { deep = "recommended" }
escalate = [{ dimension = "security_privacy", min = 2, level = "required" }]

[[verification]]
id = "dependency_audit"
title = "Dependency vulnerability audit"
capability = "dependency_audit"
levels = { deep = "recommended" }
escalate = [{ dimension = "external_dependencies", min = 2, level = "recommended" }]

[[verification]]
id = "secret_scan"
title = "Secret scanning"
capability = "secret_scanning"
signals = ["sensitive-data", "payments", "authentication"]
levels = { fast = "recommended", standard = "recommended", deep = "required" }

[[verification]]
id = "migration_check"
title = "Database migration check"
capability = "migration_checks"
levels = {}
escalate = [{ dimension = "data_integrity", min = 2, level = "required" }]

[[verification]]
id = "performance_tests"
title = "Performance measurement"
capability = "performance_testing"
signals = ["performance"]
levels = { fast = "recommended", standard = "recommended", deep = "required" }

[[verification]]
id = "independent_review"
title = "Independent code review"
capability = "code_review"
levels = { standard = "recommended", deep = "required" }
escalate = [{ dimension = "security_privacy", min = 2, level = "required" }]
