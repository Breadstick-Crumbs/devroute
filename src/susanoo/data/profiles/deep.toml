name = "deep"
title = "DEEP"
summary = "Complex, uncertain, or high-risk change. Architecture first, explicit plan, isolated work, independent review, evidence-backed completion."
intended_for = "New systems, architectural changes, security- or data-critical work, and tasks with significant unknowns."
planning = "explicit technical plan, reviewed before implementation (Claude Code plan mode is a good fit)"
delegation = "recommended: independent reviewer subagent; optional parallel subagents for independent feature areas"
review = "independent review by a separate agent context (susanoo-reviewer), plus human review of security-sensitive parts"
isolation = "isolated git worktree or feature branch (for example `claude --worktree <name>`)"
verification_depth = "comprehensive: unit, integration, security, and end-to-end checks matched to the risks found"
report = "evidence-backed completion report with recorded verification results"

approval_checkpoints = [
    "Approve requirements and architecture before planning details.",
    "Approve the technical plan before implementation starts.",
    "Approve the final change after independent review and verification.",
]

[[phases]]
id = "requirements"
title = "Requirements and architecture analysis"
action = "Establish requirements, constraints, and the architecture. Surface open questions instead of guessing."
approval = true

[[phases]]
id = "risk"
title = "Dependency and risk assessment"
action = "List external dependencies, security and data risks, and irreversible steps. Confirm the safety controls below."

[[phases]]
id = "plan"
title = "Technical plan"
action = "Write an explicit plan with milestones, interfaces, test strategy, and rollback approach."
approval = true

[[phases]]
id = "research"
title = "Targeted research"
action = "Only when justified by missing capabilities or high uncertainty: research options and record findings (`susanoo research`)."

[[phases]]
id = "implement"
title = "Isolated implementation"
action = "Implement milestone by milestone in an isolated branch or worktree. Delegate independent feature areas to subagents only when they do not share files."

[[phases]]
id = "review"
title = "Independent review"
action = "Have a separate agent context (susanoo-reviewer) review the full diff against the plan and the risks."

[[phases]]
id = "verify"
title = "Integration and security verification"
action = "Run the full required verification set and record results as evidence (`susanoo verify --execute`)."

[[phases]]
id = "report"
title = "Evidence-backed completion"
action = "Report results with the recorded evidence, unresolved risks, and anything that was not verified."
approval = true

[[capabilities]]
id = "version_control"
level = "required"
reason = "isolated branch or worktree and reviewable history"

[[capabilities]]
id = "code_review"
level = "required"
reason = "DEEP workflow requires independent review"

[[capabilities]]
id = "code_navigation"
level = "recommended"
reason = "investigate affected code before changing it"
