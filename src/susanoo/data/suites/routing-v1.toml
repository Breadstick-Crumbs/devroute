# Routing reference suite v1.
#
# Each case states the profile the maintainers expect and, optionally, the
# minimum risk level the assessment must reach. These are judgments about a
# sensible route, not measured ground truth. The suite exists to make routing
# behavior explicit and to catch unintended changes when heuristics are edited.

