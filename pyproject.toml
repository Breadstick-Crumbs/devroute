[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "susanoo"
version = "0.6.0"
description = "Adaptive AI-native engineering framework. The right workflow, tools, and agents for every development task."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Susanoo contributors" }]
keywords = ["claude-code", "ai-agents", "developer-tools", "workflow", "software-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Susanoo has no runtime dependencies by design (see docs/decisions/0001).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
]

[project.scripts]
susanoo = "susanoo.entry:main"

[project.urls]
Homepage = "https://github.com/Breadstick-Crumbs/susanoo"
Documentation = "https://github.com/Breadstick-Crumbs/susanoo/tree/main/docs"
Issues = "https://github.com/Breadstick-Crumbs/susanoo/issues"
Changelog = "https://github.com/Breadstick-Crumbs/susanoo/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/susanoo"]

[tool.hatch.build.targets.sdist]
include = ["src/susanoo", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["susanoo"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4"]
ignore = [
    "S603",  # subprocess calls use argv lists built from Susanoo's own registry; see verification/executor.py
    "RUF001",
]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 110; long user-facing strings may run to 130.
max-line-length = 130

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S108", "RUF059"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/susanoo"]

[tool.bandit]
exclude_dirs = ["tests"]
